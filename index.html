<!DOCTYPE html>
<html>
<body>
<div id="container">
    <video id="localVideo" playsinline autoplay muted></video>
    <video id="remoteVideo" playsinline autoplay></video>

    <div class="box">
        <button id="startButton">Start</button>
        <button id="callButton">Call</button>
        <button id="hangupButton">Hang Up</button>
    </div>

</div>
<script type="module">
import {  initMomento, subscribeToMessages, publish, getKey, setKey, deleteKey, valueExists  } from './src/momento.js';

initMomento();
subscribeToMessages('cache', 'visitor:abc:inbox', onEvent)

const startButton = document.getElementById('startButton');
const hangupButton = document.getElementById('hangupButton');
const callButton = document.getElementById('callButton');
hangupButton.disabled = true;

const localVideo = document.getElementById('localVideo');
let remoteVideo = document.getElementById('remoteVideo');

let pc;
let localStream;
let remoteCandidatesBuffer = [];
let remoteDescriptionSet = false;



const allThere = async (from, totalParts) => {
    for (let index = 1; index <= totalParts; index++) {
      console.log(`checking cache.. if ${from}-${index} has a value`)
      const exists = await valueExists("cache", `${from}-${index}`)
      if (!exists) {
        console.log(`we did not find ${from}-${index}`)
        console.log(`we are missing part ${index} of ${totalParts}`)
        return false
      }
    }
    console.log(`we have ${totalParts}/${totalParts}  parts in cache`)
    return true
  }

  const pieceTogether = async (from, totalParts) => {
    let message = ""
    for (let index = 1; index <= totalParts; index++) {
      const value = await getKey("cache", `${from}-${index}`)
      // We dont want them chilling in the cache
      deleteKey('cache',`${from}-${index}`)
      message += value ?? ""
    }
    console.log(`Assembled full object: ${message}`)
    return message
  }
  function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// MAIN EVENT HANDLER
async function onEvent(e){

  console.log('event', e);
  
  switch (e.type) {
    case 'offer':
      handleOffer(e);
      break;
    case 'answer':
      console.log('answer', e);
      //handleAnswer(e);
      // A visitor is sending an offer
      // These come in 2 parts (limits on message size), so we need to
      // 1. Receive the offer and the part count
      // 2. Just save it in the cache
      // 3. Check if we have all the parts
      // 4. If we do, we will piece it together
      // 5. We need to set up the local stream
      // 6. Set the remote description with the offer
      // 7. Create an answer
      // 8. Send the answer back to the visitor in 2 parts
      // 9. Set the local description with the answer
      // 10. Set the state to active
      // 1. Receive the offer and the part count
      const { part, totalParts, sdpFragment, from } = e
      // 2. Just save it in the cache
      await setKey("cache", `${from}-${part}`, sdpFragment)
      // 3. Check if we have all the parts
      const ready = await allThere(from, totalParts)
      console.log(`ready: ${ready}`)
      console.log(pc.signalingState);
      if (ready) {
        // 4. If we do, we will piece it together
        const fullSdp = await pieceTogether(from, totalParts)
        //console.log("Assembled full SDP:", fullSdp)
        // 6. Set the remote description with the offer
       await pc.setRemoteDescription({type: 'answer', sdp: fullSdp})

      remoteDescriptionSet = true;
      remoteCandidatesBuffer.forEach(candidate => {
        pc.addIceCandidate(new RTCIceCandidate(candidate))
          .catch(e => console.error("Error adding ICE candidate from buffer:", e));
      });
      remoteCandidatesBuffer = [];
        }    
      break;
    case 'candidate':
      handleRemoteIceCandidate(e);
      break;
    case 'call-accepted':
      // Startup video locally
      localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
      localVideo.srcObject = localStream;

      await setupRTC();
      console.log(pc.signalingState);

      const offer =  await pc.createOffer();
      console.log(`offer created with details: ${offer}`);

      const sdp = offer.sdp;
      const midpoint = Math.ceil(sdp.length / 2);
      const part1 = sdp.slice(0, midpoint);
      const part2 = sdp.slice(midpoint);
      //TODO: FROM NEEDS TO BE DYNAMIC
      const sdpMessagePart1 = {
        from: 'abc',
        type: "offer",
        part: "1",
        totalParts: "2",
        sdpFragment: part1
      };
      const sdpMessagePart2 = {
        from: 'abc',
        type: "offer",
        part: "2",
        totalParts: "2",
        sdpFragment: part2
      };
      //console.log(JSON.stringify(offer))
      await publish('cache','agent:xyz:inbox', JSON.stringify(sdpMessagePart1))
      await sleep(2000);
      await publish('cache','agent:xyz:inbox', JSON.stringify(sdpMessagePart2))
      
      //signaling.postMessage({type: 'offer', sdp: offer.sdp});
      await pc.setLocalDescription(offer)
     
      break;
    case 'ready':
      // A second tab joined. This tab will initiate a call unless in a call already.
      if (pc) {
        console.log('already in call, ignoring');
        return;
      }
      makeCall();
      break;
    case 'bye':
      if (pc) {
        hangup();
      }
      break;
    default:
      console.log('unhandled', e);
      break;
  }
}
function handleRemoteIceCandidate(candidate) {
  if (remoteDescriptionSet) {
    pc.addIceCandidate(new RTCIceCandidate(candidate))
      .catch(e => console.error("Error adding ICE candidate:", e));
  } else {
    remoteCandidatesBuffer.push(candidate);
  }
}
callButton.onclick = async () => {

  startButton.disabled = true;
  hangupButton.disabled = false;

  const callMessage = {
    from: 'abc',
    type: "call",
  }

  publish('cache','agent:xyz:inbox', JSON.stringify(callMessage))

};

startButton.onclick = async () => {
  localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
  localVideo.srcObject = localStream;


  startButton.disabled = true;
  hangupButton.disabled = false;

  signaling.postMessage({type: 'ready'});
};

hangupButton.onclick = async () => {
  hangup();
  signaling.postMessage({type: 'bye'});
};

async function hangup() {
  if (pc) {
    pc.close();
    pc = null;
  }
  localStream.getTracks().forEach(track => track.stop());
  localStream = null;
  startButton.disabled = false;
  hangupButton.disabled = true;
};


function setupRTC(){

  if (pc) {
    console.error('cannot create RTC connection if there is existing one');
    return;
  }

  console.log(`setting up RTC Peerconnection`);
  pc = new RTCPeerConnection();
  // RTC Connection event handlers
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  // Ice candidate event
  pc.onicecandidate = e => {
    const message = {
      type: 'candidate',
      candidate: null,
    };
    if (e.candidate) {
      message.candidate = e.candidate.candidate;
      message.sdpMid = e.candidate.sdpMid;
      message.sdpMLineIndex = e.candidate.sdpMLineIndex;
    }
    publish('cache','agent:xyz:inbox', JSON.stringify(message))
    //signaling.postMessage(message);
  };
  pc.ontrack = (e) => {
  console.log('[ontrack] Received track:', e.track.kind);
  console.log('[ontrack] MediaStream:', e.streams[0]);

  e.streams[0].getTracks().forEach(track => {
    console.log('[ontrack] Stream contains track:', track.kind);
  });
  try {
    remoteVideo.srcObject = e.streams[0];
  } catch (error) {
    console.error('Error setting remote video source:', error);
  }
};

}

async function handleCandidate(candidate) {
  if (!pc) {
    console.error('no peerconnection');
    return;
  }
  if (!candidate.candidate) {
    await pc.addIceCandidate(null);
  } else {
    await pc.addIceCandidate(candidate);
  }
}
